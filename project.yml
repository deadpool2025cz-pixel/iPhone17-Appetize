name: iPhone17Demo
options:
  bundleIdPrefix: cz.bymatiass
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "iPhone 17 Demo"
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  iPhone17Demo:
    type: application
    platform: iOS
    sources:
      - path: iPhone17Demo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.bymatiass.iphone17demo
        PRODUCT_NAME: iPhone17Demo
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: []
